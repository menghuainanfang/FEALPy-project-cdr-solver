<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>切向移动 · 网格优化全流程</title>
<style>
:root{color-scheme:light;--ink:#203e3a;--muted:#647670;--line:#d9e2dc;--accent:#087b69}*{box-sizing:border-box}body{margin:0;background:#f4f5f0;color:var(--ink);font:15px/1.65 system-ui,"Microsoft YaHei",sans-serif}main{max-width:1120px;margin:auto;padding:32px 24px}h1{font-size:30px;letter-spacing:-.5px;margin:0}p{margin:8px 0;color:var(--muted)}header{margin-bottom:22px}.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:16px 0}button,select{font:inherit;background:white;color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:8px 12px;cursor:pointer;max-width:100%}button.primary{background:var(--accent);color:white;border-color:var(--accent)}button:disabled{opacity:.4;cursor:default}button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #b77728;outline-offset:3px}.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:18px 0}.flow span{padding:10px;border-bottom:3px solid var(--line);color:var(--muted);font-size:13px}.flow [aria-current=true]{border-color:var(--accent);color:var(--ink);background:#e5eee6;border-radius:6px 6px 0 0}.status{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin:16px 0}.status strong{font-size:17px}.result{font-size:13px;background:#e7ece7;border-radius:20px;padding:4px 12px}.result.complete{background:#d8ebd6;color:#275d34}.meshes{display:grid;grid-template-columns:1fr 1fr;gap:16px}article{border:1px solid var(--line);border-radius:12px;background:#fff;padding:16px}h2{font-size:17px;margin:0}article p{font-size:12px;min-height:40px;margin-bottom:0}canvas{width:100%;aspect-ratio:1;display:block;cursor:crosshair}.explanation{min-height:54px;font-size:14px;color:var(--ink)}.timeline{display:flex;gap:10px;align-items:center;margin:16px 0}.timeline input{flex:1;min-width:0;accent-color:var(--accent)}.rounds{display:flex;gap:6px;overflow-x:auto;padding:5px 0 10px}.rounds button{flex-shrink:0;font-size:13px;padding:5px 10px}.rounds [aria-pressed=true]{background:var(--ink);color:white}.checks{display:flex;gap:16px;flex-wrap:wrap;padding:13px 0;border-top:1px solid var(--line);font-size:13px}details{border-top:1px solid var(--line);padding:14px 0;margin-top:18px}summary{cursor:pointer;color:var(--muted);font-size:13px}details p{white-space:pre-line;font-size:13px}.small{font-size:12px}meter{display:block;width:100%;max-width:500px;height:12px}footer{margin-top:24px;font-size:12px;color:var(--muted)}a{color:var(--accent)}@media(max-width:720px){main{padding:20px 14px}.meshes{grid-template-columns:1fr}h1{font-size:25px}.flow{grid-template-columns:1fr 1fr}.flow span{padding:7px}.controls{gap:7px}.controls button{padding:7px 9px}article p{min-height:0}.status strong{font-size:15px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
<main><nav class="small"><a href="../p2_v2/index.html">网格随时间演化：进入三重循环 →</a></nav><header><p class="small">切向边界移动 / 内外迭代完整回放</p><h1>看清网格如何一步步收敛</h1><p>每轮先优化计算网格，再映射回物理网格；外层持续迭代，直到满足收敛条件。</p></header>
<div class="controls"><label for="case">选择情况</label><select id="case" aria-label="选择情况"></select><button id="play" class="primary">播放全流程</button><button id="reset">回到起点</button><button id="final">查看收敛结果</button><select id="speed" aria-label="播放速度"><option value="80">正常速度</option><option value="25">快速</option><option value="240">慢速</option></select></div>
<p id="case-summary" class="small"></p>
<div class="flow" aria-label="本轮优化流程"><span data-phase="setup">① 建立计算映射</span><span data-phase="inner">② 计算网格内迭代</span><span data-phase="mapping">③ 映射回物理网格</span><span data-phase="check">④ 外层收敛检查</span></div>
<label class="small" for="rounds">外迭代轮次 </label><select id="rounds" aria-label="选择外迭代轮次"></select>
<div class="status"><strong id="progress"></strong><span id="result" class="result" role="status"></span></div>
<p id="explanation" class="explanation"></p>
<section class="meshes"><article><h2>计算网格 ξ</h2><p id="computational-caption"></p><canvas id="computational" role="img" aria-label="当前内迭代计算网格"></canvas></article><article><h2>物理网格 x</h2><p id="physical-caption"></p><canvas id="physical" role="img" aria-label="当前映射物理网格"></canvas></article></section>
<div class="timeline"><button id="previous" aria-label="上一步">←</button><input id="timeline" type="range" min="0" value="0" aria-label="完整优化过程时间轴"><button id="next" aria-label="下一步">→</button></div>
<div class="checks"><span id="residual"></span><span id="inner-check"></span><span id="outer-check"></span></div>
<div class="checks"><span id="energy-value"></span><span id="quality-value"></span></div><p id="mapping-point" class="small"></p><details id="quantitative"><summary>展开本轮能量、质量曲线和收敛阈值</summary><div class="meshes"><section><p class="small">本轮相对能量变化 I_h(s)/I_h(0)−1 / 网格伪时间 s</p><canvas id="energy-curve" style="aspect-ratio:auto;height:160px" aria-label="本轮能量曲线" role="img"></canvas></section><section><p class="small">蓝：对齐 RMS；橙：等分布 RMS；虚线：理想值1</p><canvas id="quality-curve" style="aspect-ratio:auto;height:160px" aria-label="本轮对齐等分布曲线" role="img"></canvas></section></div><div id="thresholds"></div></details>
<details><summary>查看收敛条件</summary><p id="criteria"></p></details>
<footer>各轮展示实际接受状态；网格伪时间在每轮重新开始。能量仅在本轮冻结度量下判断。<a href="../../../docs/mentor_2026-10-23/optimization_flow.md">计算说明</a></footer>
</main><script id="flow-data" type="application/json">__FLOW_DATA__</script><script>__FLOW_SCRIPT__</script></html>
